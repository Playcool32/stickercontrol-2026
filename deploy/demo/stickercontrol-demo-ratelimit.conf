# Zonas de rate limiting (PLANTILLA). Destino: /etc/nginx/conf.d/stickercontrol-demo-ratelimit.conf
# Nombres propios para no chocar con las zonas de web-turismo / turismo-demo.
limit_req_zone $binary_remote_addr zone=scdemo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=scdemo_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=scdemo_conn:10m;
