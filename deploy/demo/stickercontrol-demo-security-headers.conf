# Encabezados de seguridad de la demo (PLANTILLA).
# Destino: /etc/nginx/snippets/stickercontrol-demo-security-headers.conf
# Se incluye en el server y en cada location que agrega su propio add_header
# (en nginx, un add_header dentro de un location anula los heredados).
# Sin HSTS, igual que el resto de los sitios del VPS (decision 2026-10-08).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
