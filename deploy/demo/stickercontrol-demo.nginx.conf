# StickerControl Demo Roura — vhost (PLANTILLA, no instalada).
# Destino: /etc/nginx/sites-available/stickercontrol-demo (+ symlink en sites-enabled).
# Requiere: DNS A stickercontrol-demo.roura.com.ar -> VPS, certificado de certbot,
# /etc/nginx/conf.d/stickercontrol-demo-ratelimit.conf y
# /etc/nginx/snippets/stickercontrol-demo-security-headers.conf.
# No toca ningun otro vhost (roura, sba-demo, turismo-demo, seguros-lab, vaninacuccuru, energir).

server {
    listen 80;
    listen [::]:80;
    server_name stickercontrol-demo.roura.com.ar;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stickercontrol-demo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://stickercontrol-demo.roura.com.ar$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stickercontrol-demo.roura.com.ar;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/stickercontrol-demo.roura.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stickercontrol-demo.roura.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Build estatico publicado: public -> builds/<commit>
    root /var/www/stickercontrol-demo/public;
    index index.html;

    access_log /var/log/nginx/stickercontrol-demo.access.log;
    error_log  /var/log/nginx/stickercontrol-demo.error.log warn;

    client_max_body_size 16k;
    limit_conn scdemo_conn 20;

    include snippets/stickercontrol-demo-security-headers.conf;

    location ~ /\. {
        deny all;
        return 404;
    }

    # Creacion de sandboxes: limite estricto (ademas del limite en la app).
    location = /api/auth/demo {
        limit_req zone=scdemo_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8012;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=scdemo_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8012;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/stickercontrol-demo-security-headers.conf;
    }

    location /flags/ {
        try_files $uri =404;
        expires 1d;
    }

    # SPA: rutas de React Router (/album, /cerca, /share/:token...) -> index.html sin cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/stickercontrol-demo-security-headers.conf;
    }
}
