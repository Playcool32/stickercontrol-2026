# StickerControl Demo Roura — vhost TEMPORAL solo HTTP (PLANTILLA).
# Primer paso del despliegue: permite emitir el certificado (webroot acme/) y
# comprobar el sitio por HTTP antes de que exista el certificado. Se reemplaza
# por stickercontrol-demo.nginx.conf (HTTPS + redireccion) una vez emitido.
# Nota: con SESSION_COOKIE_SECURE=true la sesion no funciona por HTTP; en esta
# fase solo se verifican estaticos, /api/health y ACME.
# Requiere /etc/nginx/conf.d/stickercontrol-demo-ratelimit.conf y
# /etc/nginx/snippets/stickercontrol-demo-security-headers.conf.

server {
    listen 80;
    listen [::]:80;
    server_name stickercontrol-demo.roura.com.ar;
    server_tokens off;

    root /var/www/stickercontrol-demo/public;
    index index.html;

    access_log /var/log/nginx/stickercontrol-demo.access.log;
    error_log  /var/log/nginx/stickercontrol-demo.error.log warn;

    client_max_body_size 16k;
    limit_conn scdemo_conn 20;
    include snippets/stickercontrol-demo-security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stickercontrol-demo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /api/auth/demo {
        limit_req zone=scdemo_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8012;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=scdemo_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8012;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/stickercontrol-demo-security-headers.conf;
    }
}
